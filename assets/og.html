<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "PJS";
        src: url("./pjs-800.woff2") format("woff2");
        font-weight: 800;
      }
      @font-face {
        font-family: "PJS";
        src: url("./pjs-700.woff2") format("woff2");
        font-weight: 700;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #080e20;
        color: #ffffff;
        font-family: "PJS", sans-serif;
        position: relative;
      }
      .glow {
        position: absolute;
        border-radius: 999px;
        background: #5550fe;
        filter: blur(90px);
        opacity: 0.5;
      }
      .glow.tr {
        width: 420px;
        height: 420px;
        right: -170px;
        top: -190px;
      }
      .glow.bl {
        width: 320px;
        height: 320px;
        left: -170px;
        bottom: -170px;
        opacity: 0.42;
      }
      .frame {
        position: relative;
        height: 100%;
        padding: 62px 78px;
        display: flex;
        flex-direction: column;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 22px;
      }
      .mark {
        width: 74px;
        height: 74px;
        border-radius: 21px;
        background: linear-gradient(
          150deg,
          #615ef9 0%,
          #5b58f8 58%,
          #5450f5 100%
        );
        display: grid;
        place-items: center;
        box-shadow: 0 12px 30px -12px rgba(85, 80, 254, 0.9);
      }
      .mark svg {
        width: 38px;
        height: 38px;
      }
      .wordmark {
        font-size: 34px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .divider {
        width: 1px;
        height: 34px;
        background: #2b3a5b;
        margin: 0 6px;
      }
      .sub {
        font-size: 34px;
        font-weight: 700;
        color: #64789c;
      }
      h1 {
        margin: 74px 0 0;
        font-size: 86px;
        line-height: 1.04;
        font-weight: 800;
        letter-spacing: -0.035em;
        max-width: 980px;
      }
      .grad {
        background: linear-gradient(
          93deg,
          #a83efa 0%,
          #7b40fc 35%,
          #5847ff 65%,
          #4849f9 100%
        );
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      p {
        margin: 30px 0 0;
        font-size: 30px;
        font-weight: 700;
        color: #9db8e0;
        letter-spacing: -0.01em;
      }
      .footer {
        margin-top: auto;
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .pill {
        height: 50px;
        padding: 0 26px;
        display: inline-flex;
        align-items: center;
        border-radius: 999px;
        border: 1px solid #1f2c48;
        background: rgba(168, 198, 238, 0.03);
        color: #a8c6ee;
        font-size: 21px;
        font-weight: 700;
      }
      .note {
        margin-left: auto;
        color: #7a94ba;
        font-size: 21px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="glow tr"></div>
    <div class="glow bl"></div>
    <div class="frame">
      <div class="brand">
        <span class="mark">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="#fff"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="3" width="18" height="18" rx="4" />
            <circle cx="9" cy="9" r="1.6" fill="#fff" stroke="none" />
            <path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21" />
          </svg>
        </span>
        <span class="wordmark">PixelForge</span>
        <span class="divider"></span>
        <span class="sub">Converter</span>
      </div>

      <h1>Convert images<br /><span class="grad">in seconds.</span></h1>
      <p>Your images, your format. Simple, fast, and secure.</p>

      <div class="footer">
        <span class="pill">JPG</span>
        <span class="pill">PNG</span>
        <span class="pill">WEBP</span>
        <span class="pill">AVIF</span>
        <span class="note">100% in your browser</span>
      </div>
    </div>
  </body>
</html>
